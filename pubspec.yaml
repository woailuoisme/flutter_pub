name: lunchbox_hub
description: "Lunchbox Hub - Professional vending machine management platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 路由与网络
  go_router: ^18.1.2
  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0
  retrofit: ^4.10.0
  connectivity_plus: ^7.3.1
  web_socket_channel: ^3.0.3
  flutter_markdown_plus: ^1.0.12

  # 存储
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1

  # 基础 UI
  flutter_screenutil: ^5.9.3
  flex_color_scheme: ^9.0.0
  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5
  material_symbols_icons: ^4.2960.0
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.2

  # 扩展 UI 组件
  toastification: ^3.2.2
  cached_network_image: ^4.0.6
  infinite_scroll_pagination: ^5.1.1
  custom_refresh_indicator: ^4.0.2
  flutter_spinkit: ^5.2.2
  flutter_slidable: ^5.2.0
  page_transition: ^2.2.2
  skeletonizer: ^3.0.0
  webview_flutter: ^4.14.1
  convex_bottom_bar: ^3.2.0
  google_nav_bar: ^5.0.7
  scrollable_positioned_list: ^0.3.8
  upgrader: ^13.8.0

  # 地图与定位
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  latlong2: ^0.10.1

  # 系统与设备功能
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

  # 业务功能
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  slang_flutter: ^4.19.0

  # 图表
  fl_chart: ^1.3.0

  # 逻辑工具与日志
  intl: ^0.20.3
  talker_flutter: ^5.2.0
  talker_dio_logger: ^5.2.0

  path: ^1.9.1
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  envied: ^1.3.10
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod: ^3.4.3

  # 环境配置生成
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9

  # 代码生成器
  # 2.17+ 要求 build 5.x，而 retrofit_generator/json_serializable 仍锁 build ^4
  build_runner: ">=2.16.2 <2.17.0"
  riverpod_generator: ^4.0.9
  retrofit_generator: ^10.3.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  envied_generator: ^1.3.10
  go_router_builder: ^4.5.3

  # 国际化生成
  slang: ^4.19.2

  # 开发工具
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  # retrofit_generator / json_serializable 只支持 build 4.x
  build: 4.0.9

flutter:
  uses-material-design: true

  # 资源配置
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/html/
