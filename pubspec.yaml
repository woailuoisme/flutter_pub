name: lunchbox_hub
description: "Lunchbox Hub - Professional vending machine management platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # 路由与网络
  go_router: ^17.3.0
  dio: ^5.10.0
  dio_http2_adapter: ^2.7.1
  retrofit: ^4.9.2
  connectivity_plus: ^7.2.0
  web_socket_channel: ^3.0.3
  flutter_markdown_plus: ^1.0.7

  # 存储
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

  # 基础 UI
  flutter_screenutil: ^5.9.3
  flex_color_scheme: ^8.4.0
  material_symbols_icons: ^4.2951.0
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0

  # 扩展 UI 组件
  toastification: ^3.2.0
  cached_network_image: ^3.4.1
  infinite_scroll_pagination: ^5.1.1
  custom_refresh_indicator: ^4.0.1
  flutter_spinkit: ^5.2.2
  flutter_slidable: ^4.0.3
  page_transition: ^2.2.2
  skeletonizer: ^2.1.3
  awesome_dialog: ^3.3.0
  webview_flutter: ^4.14.0
  convex_bottom_bar: ^3.2.0
  google_nav_bar: ^5.0.7
  scrollable_positioned_list: ^0.3.8
  upgrader: ^13.5.0

  # 地图与定位
  flutter_map: ^8.3.0
  geolocator: ^14.0.3
  latlong2: ^0.9.1

  # 系统与设备功能
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  share_plus: ^13.2.0
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  image_picker: ^1.2.2
  url_launcher: ^6.3.2

  # 业务功能
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  slang_flutter: ^4.17.0

  # 图表
  fl_chart: ^1.2.0

  # 逻辑工具与日志
  intl: ^0.20.2
  talker_flutter: ^5.1.17
  talker_dio_logger: ^5.1.17
  fpdart: ^1.2.0

  path: ^1.9.1
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  envied: ^1.3.7
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod: ^3.3.2

  # 环境配置生成
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.4

  # 代码生成器
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  retrofit_generator: ^10.2.7
  freezed: 3.2.6-dev.1
  json_serializable: ^6.14.0
  objectbox_generator: ^5.3.2
  envied_generator: ^1.3.7
  go_router_builder: ^4.3.0

  # 国际化生成
  slang: ^4.17.0

  # 开发工具
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  # 统一 analyzer 到 ^12.0.0：
  #   - riverpod_generator 4.0.4 要求 ^12.0.0
  #   - freezed 3.2.6-dev.1 要求 >=12.0.0 <13.0.0
  #   - mockito 5.7.0 要求 ^13.0.0（与上冲突），降级到 5.6.4（支持 <13.0.0）
  # 待 riverpod_generator 正式支持 analyzer 13+ 后统一升级并移除 override。
  meta: ^1.18.3
  test_api: ^0.7.12
  analyzer: ^12.0.0
  dart_style: 3.1.8
  mockito: 5.6.4

flutter:
  uses-material-design: true

  # 资源配置
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/html/
