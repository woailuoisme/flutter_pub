name: Flutter Build & Release app

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # Android: APK (分 ABI) 与 AAB (Google Play)
  # ==========================================
  build-android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [apk, appbundle]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Restore Keystore & Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_DEV: ${{ secrets.ENV_DEV }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "==> Restoring release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "::warning::未配置完整的 KEYSTORE_* Secrets，跳过 release keystore 注入（将自动降级使用 Debug 证书签名）"
          fi

          if [ -n "$ENV_PROD" ]; then
            echo "$ENV_PROD" > .env.production
          elif [ -f .env.example ]; then
            echo "::warning::未配置 ENV_PROD Secret，使用 .env.example 回退生成 .env.production"
            cp .env.example .env.production
          fi

          if [ -n "$ENV_DEV" ]; then
            echo "$ENV_DEV" > .env.development
          elif [ -f .env.example ]; then
            echo "::warning::未配置 ENV_DEV Secret，使用 .env.example 回退生成 .env.development"
            cp .env.example .env.development
          fi

      - name: Prepare & CodeGen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK (Split per ABI)
        if: matrix.target == 'apk'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --split-per-abi --target-platform android-arm,android-arm64 --tree-shake-icons

          OUT=build/app/outputs/flutter-apk
          for f in "$OUT"/app-*-release.apk; do
            [ -f "$f" ] || continue
            abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            mv "$f" "$OUT/lunchbox_hub_${VERSION}_${abi}.apk"
          done

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for apk in "$OUT"/lunchbox_hub_*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -2
          done

      - name: Build AppBundle (AAB)
        if: matrix.target == 'appbundle'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons
          mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/lunchbox_hub_${VERSION}.aab"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          compression-level: 0

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-android-${{ matrix.target }}
          path: build/symbols/**
          compression-level: 9

  # ==========================================
  # iOS: macOS Runner 纯净构建
  # ==========================================
  build-ios:
    name: iOS (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcodeproj/project.pbxproj', 'pubspec.lock') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Drop CocoaPods (Enforce SwiftPM)
        run: |
          cd ios
          if [ -f Podfile ]; then
            pod deintegrate && rm -rf Podfile Podfile.lock Pods
          fi

      - name: Restore Environment Files
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_DEV: ${{ secrets.ENV_DEV }}
        run: |
          if [ -n "$ENV_PROD" ]; then
            echo "$ENV_PROD" > .env.production
          elif [ -f .env.example ]; then
            echo "::warning::未配置 ENV_PROD Secret，使用 .env.example 回退生成 .env.production"
            cp .env.example .env.production
          fi

          if [ -n "$ENV_DEV" ]; then
            echo "$ENV_DEV" > .env.development
          elif [ -f .env.example ]; then
            echo "::warning::未配置 ENV_DEV Secret，使用 .env.example 回退生成 .env.development"
            cp .env.example .env.development
          fi

      - name: Prepare & CodeGen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build iOS App
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols --tree-shake-icons
          (cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/build/lunchbox_hub_${VERSION}_ios-unsigned.zip" ./*.app)

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: build/lunchbox_hub_*_ios-unsigned.zip
          compression-level: 0

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-ios
          path: build/symbols/**
          compression-level: 9

  # ==========================================
  # Release: 汇聚全平台成果统一发版
  # ==========================================
  release:
    needs: [build-android, build-ios]
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*-*"

      - name: Package Symbols Bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for d in dist/symbols-*; do
            [ -d "$d" ] || continue
            task=${d##*/symbols-}
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/dist/lunchbox_hub_${VERSION}_symbols-$task.zip" .)
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Lunchbox Hub ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.zip
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
